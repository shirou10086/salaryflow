name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and lint GitHub flavor
        run: ./gradlew :app:testGithubDebugUnitTest :app:lintGithubDebug --stacktrace

      - name: Test and lint Play flavor
        run: ./gradlew :app:testPlayDebugUnitTest :app:lintPlayDebug --stacktrace

      - name: Assemble GitHub debug APK
        run: ./gradlew :app:assembleGithubDebug --stacktrace

      - name: Assemble Play debug AAB
        run: ./gradlew :app:bundlePlayDebug --stacktrace

      - name: Upload GitHub debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wagejar-github-debug-apk
          path: app/build/outputs/apk/github/debug/app-github-debug.apk

      - name: Upload Play debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: wagejar-play-debug-aab
          path: app/build/outputs/bundle/playDebug/app-play-debug.aab
