name: WageJar
options:
  bundleIdPrefix: com.wagejar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WageJarCore:
    path: WageJarCore
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.4.4"
    CURRENT_PROJECT_VERSION: "11"
targets:
  WageJar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WageJar
        excludes:
          - Resources
      - path: WageJar/Resources
        buildPhase: resources
    dependencies:
      - package: WageJarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wagejar.app
        PRODUCT_NAME: WageJar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WageJar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: true
